server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Deploy-freshness contract (prm_28626d25 v49).
    #
    # The origin is the single source of truth for the HTML shell and for the
    # module scripts it loads. Without an explicit Cache-Control the browser
    # falls back to heuristic freshness (10% of the age of Last-Modified), so a
    # browser can keep running an old build of /app.js after a deploy - the
    # same class of stale-module-script bug the edge was showing. The origin
    # therefore states the contract itself:
    #   - HTML and JS: always revalidate against the origin (no-cache).
    #   - CSS: short freshness window, then revalidate.
    # No Vary: Origin and no Access-Control-* headers are sent: these assets
    # are same-origin, and a per-origin Vary only splits the cache key.

    # "/" serves index.html internally, so it needs its own header block -
    # a regex location on .html$ would not apply to the internal redirect.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Module scripts (/app.js, /gods-eye.js, ...) are fetched with an Origin
    # header and were the stale build the edge served. Never cached without
    # revalidation.
    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.css$ {
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Public API (clinic sign-up, workspace auth) is proxied to the workspace
    # Node service (prm_28626d25 v274): nginx serves the static tree, the
    # service owns /api/*. The upstream hostname is the workspace service on
    # the same Docker network; the path is passed through unchanged.
    # X-Forwarded-For is appended, and the service only trusts the first hop
    # when the immediate peer is a configured trusted proxy address.
    location /api/ {
        proxy_pass http://workspace:3001;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
